name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Started by hand: optionally upload this build to a Play track, under a version name.
  workflow_dispatch:
    inputs:
      play_track:
        description: "Google Play track to upload to (empty = no upload)"
        type: choice
        options: ["", "internal", "alpha", "production"]
        default: ""
      version:
        description: "Version name for this build, e.g. 1.4-beta.2 (empty = dev)"
        type: string
        default: ""

permissions:
  contents: write # to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set once the Play service account secret exists; until then the Play upload is skipped.
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # Robolectric needs 21 for SDK 36; the app itself still targets Java 17

      - name: Build release APK and Play bundle
        env:
          BIRDY_VERSION: ${{ inputs.version }}
          KEYSTORE_B64: ${{ secrets.BIRDY_KEYSTORE_B64 }}
          BIRDY_KEYSTORE_PASSWORD: ${{ secrets.BIRDY_KEYSTORE_PASSWORD }}
        run: |
          # Without the secret (e.g. pull requests from forks) the build falls back to the debug key.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/birdy.jks"
            export BIRDY_KEYSTORE="$RUNNER_TEMP/birdy.jks"
          fi
          ./gradlew testReleaseUnitTest assembleRelease bundleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk birdy.apk
          mv app/build/outputs/bundle/release/app-release.aab birdy.aab

      - uses: actions/upload-artifact@v7
        with:
          name: birdy-apk
          path: birdy.apk

      # For the Play Console: upload this bundle (signed with the same key as the APK).
      - uses: actions/upload-artifact@v7
        with:
          name: birdy-aab
          path: birdy.aab

      # Betas (v1.4-beta.2) are GitHub pre-releases only; full versions (v1.4) also go to Google Play.
      # Track for full versions: repo variable PLAY_TRACK (default "alpha" = closed test; "production" later).
      # Optional repo variable PLAY_BETA_TRACK (e.g. "internal") sends betas to Play as well.
      - name: Decide Play upload
        id: play
        if: env.HAS_PLAY == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.play_track != '')
        env:
          FULL_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
          BETA_TRACK: ${{ vars.PLAY_BETA_TRACK }}
          MANUAL_TRACK: ${{ inputs.play_track }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$MANUAL_TRACK" ]]; then
            track="$MANUAL_TRACK"; version="${MANUAL_VERSION:-dev}"
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" == *-* ]]; then track="$BETA_TRACK"; else track="$FULL_TRACK"; fi
          fi
          echo "track=$track" >> "$GITHUB_OUTPUT"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          mkdir -p distribution/whatsnew
          python3 tools/changelog.py play "$version" > distribution/whatsnew/whatsnew-de-DE
          cat distribution/whatsnew/whatsnew-de-DE

      # Pinned to a commit (v1.1.3) so a changed tag upstream cannot slip into the release path.
      - name: Upload to Google Play
        if: steps.play.outputs.track != ''
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: birdy.minimal
          releaseFiles: birdy.aab
          track: ${{ steps.play.outputs.track }}
          releaseName: ${{ steps.play.outputs.name }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      # Notes from CHANGELOG.md: v1.4 -> "## 1.4" (all its betas merged, see tools/changelog.py),
      # v1.4-beta.2 -> "## 1.4-beta.2" as a pre-release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            extra=(--prerelease); title="Birdy $GITHUB_REF_NAME (Beta)"
          else
            extra=(); title="Birdy $GITHUB_REF_NAME"
          fi
          python3 tools/changelog.py notes "$version" > notes.md
          if grep -q '[^[:space:]]' notes.md; then extra+=(--notes-file notes.md); else extra+=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" birdy.apk --title "$title" "${extra[@]}"
